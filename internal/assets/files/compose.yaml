name: ${IPALPHA_INFRA_NAME:-ipalpha}

services:
  mongo:
    image: mongo:8
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-mongo
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq
    hostname: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Developer-only capture inbox. Credentials and SMTP are not needed locally.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: '200'
      MP_MAX_AGE: 24h
      MP_MAX_MESSAGE_SIZE: '1'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
    cpus: 1
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  default:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}

volumes:
  mongo-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-mongo-data
  redis-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-redis-data
  rabbitmq-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq-data
