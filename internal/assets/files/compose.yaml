name: ${IPALPHA_INFRA_NAME:-ipalpha}

services:
  # Public, secret-free, development-only gateway. Never calls real AI providers.
  cpamc:
    image: docker.io/kevynsax/cpamc-simulator:0.1.1
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-cpamc
    ports:
      - "127.0.0.1:${CPAMC_HOST_PORT:-8317}:8317"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, /cpamc-simulator, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 12
  mongo:
    image: mongo:8
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-mongo
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq
    hostname: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Developer-only capture inbox. Credentials and SMTP are not needed locally.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: '200'
      MP_MAX_AGE: 24h
      MP_MAX_MESSAGE_SIZE: '1'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
    cpus: 1
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # S3-compatible store for photos-api, notifications-api, documents-api, drive-api and virtual-assistant (same image as production). Buckets are created by
  # `rustfs-init` after `up` (profile "init": run explicitly by ./run, never part of `up`).
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-rustfs
    command: ["/data"]
    ports:
      - "127.0.0.1:${RUSTFS_HOST_PORT:-9000}:9000"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rustfs-init:
    profiles: ["init"]
    image: amazon/aws-cli:2.37.9
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for bucket in photos church-email-images documents drive virtual-assistant; do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$bucket" \
            || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$bucket"
        done
        # Browser PUT/GET with presigned URLs (IPAlpha Drive): drive-webapp (5116) and Oikos (5110). Not fatal if the store ignores CORS.
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket drive --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:5116","http://localhost:5110"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}' \
          || echo "rustfs: CORS for the drive bucket was not applied"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy

  # Optional (profile "face", on with `face=on` in settings or ./run --face): the core face service
  # (ipalpha-dev/face-service), the same image production runs. Stores nothing. Off = photos-api skips face indexing and search.
  face:
    profiles: ["face"]
    image: registry.kevyn.com.br/ip-alpha/core/face-service:0.1.0
    platform: linux/amd64 # the image has no arm64 manifest; emulated on Apple Silicon
    container_name: ${IPALPHA_INFRA_NAME:-ipalpha}-face
    ports:
      - "127.0.0.1:${FACE_HOST_PORT:-8000}:8000"
    environment:
      FACE_MODEL: buffalo_l
      FACE_MODEL_ROOT: /app/data/insightface
      FACE_DET_SIZE: "640"
      FACE_MAX_BYTES: "8388608"
    volumes:
      - face-models:/app/data/insightface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

networks:
  default:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}

volumes:
  mongo-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-mongo-data
  redis-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-redis-data
  rabbitmq-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-rabbitmq-data
  rustfs-data:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-rustfs-data
  face-models:
    name: ${IPALPHA_INFRA_NAME:-ipalpha}-face-models
