name: tooling

# Tests the ipalpha tool on Windows, Linux and macOS, runs a real ./run against the actual services
# on Linux, and publishes the binaries as a GitHub release when master changes.
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: git identity
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch master
          git config --global core.longpaths true
      - name: vet
        run: go vet ./...
      - name: unit + end-to-end tests
        run: go test -count=1 ./...
      - name: install scripts parse
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command '$null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
          else
            sh -n install.sh && bash -n bootstrap.sh
          fi
      - name: cross-compile every target
        if: runner.os == 'Linux'
        run: |
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/ipalpha
          done

  # Windows: the generated run.cmd starts the real binary from cmd and PowerShell.
  windows-wrappers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build -o ipalpha.exe ./cmd/ipalpha
      - name: setup a workspace from local origins, then call the wrappers
        shell: pwsh
        run: |
          git config --global user.name ci; git config --global user.email ci@example.invalid
          git config --global init.defaultBranch master
          $o = Join-Path $env:RUNNER_TEMP origins
          foreach ($r in 'deployment','shared-js','shared-ui','auth-api','persons-api','auth-webapp','oikos-webapp') {
            git init -q --bare "$o\$r.git"
            $s = Join-Path $env:RUNNER_TEMP "seed\$r"; git clone -q "$o\$r.git" $s
            Set-Content "$s\README.md" "# $r"
            if ($r -eq 'shared-js') {
              # POSIX script syntax: only works when npm runs scripts with Git Bash (npm_config_script_shell).
              Set-Content "$s\package.json" '{"name":"@ipalpha/shared-js","version":"1.0.0","scripts":{"build":"mkdir -p dist && (echo one > dist/a.txt & echo two > dist/b.txt; wait)"}}'
            }
            git -C $s add -A; git -C $s commit -qm init; git -C $s push -q origin master
          }
          $env:IPALPHA_CLONE_FROM = $o; $env:IPALPHA_SKIP_TOOLS = '1'
          $env:IPALPHA_SUPERUSER_PHONE = '11987654321'; $env:IPALPHA_AI_CLI = 'none'; $env:IPALPHA_LANG = 'pt-BR'
          $ws = Join-Path $env:RUNNER_TEMP 'IpAlpha-ci'
          .\ipalpha.exe setup $ws --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location $ws
          if (-not (Test-Path core\shared-js\dist\a.txt) -or -not (Test-Path core\shared-js\dist\b.txt) -or (Test-Path core\shared-js\-p)) {
            Get-ChildItem -Recurse .ipalpha\logs | Select-Object FullName; Get-Content .ipalpha\logs\npm\* -ErrorAction SilentlyContinue
            throw 'npm.cmd + Git Bash script shell did not build shared-js'
          }
          if (Test-Path .\run) { throw 'extensionless wrapper written on Windows' }
          $out = (.\run --help | Out-String); if ($out -notmatch 'until-ready') { throw "run.cmd from PowerShell: $out" }
          $out = (cmd /c "run.cmd --help" | Out-String); if ($out -notmatch 'until-ready') { throw "run.cmd from cmd: $out" }
          $out = (.\doctor | Out-String); Write-Host $out
          if ($out -notmatch 'Git Bash') { throw 'doctor does not check Git Bash' }
          .\ipalpha config set lang de; if ((.\ipalpha config get lang | Out-String).Trim() -ne 'de') { throw 'config' }

  # Linux: the real IPAlpha services under ./run with Docker, ports already taken by other programs.
  linux-run:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: go build -o ipalpha ./cmd/ipalpha
      - name: GitHub access to the private repositories
        id: access
        env:
          GH_TOKEN: ${{ secrets.IPALPHA_REPOS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::warning::IPALPHA_REPOS_TOKEN not set: the real ./run check is skipped"; exit 0; fi
          gh auth setup-git
      - name: occupy default ports (the tool must move around them)
        if: steps.access.outputs.skip != '1'
        run: |
          for p in 3005 5110 27017; do python3 -m http.server $p --bind 127.0.0.1 >/dev/null 2>&1 & done
          sleep 1
      - name: setup + ./run until every service is ready
        if: steps.access.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.IPALPHA_REPOS_TOKEN }}
          IPALPHA_SKIP_TOOLS: "1"
          IPALPHA_SUPERUSER_PHONE: "11987654321"
          IPALPHA_AI_CLI: none
          IPALPHA_LANG: en-US
        run: |
          ./ipalpha setup "$RUNNER_TEMP/ipalpha-ci" --yes
          cd "$RUNNER_TEMP/ipalpha-ci"
          ./run --until-ready 12m
      - name: logs on failure
        if: failure() && steps.access.outputs.skip != '1'
        run: |
          tail -n 60 "$RUNNER_TEMP"/ipalpha-ci/.ipalpha/logs/run/*.log || true
          cat "$RUNNER_TEMP"/ipalpha-ci/.ipalpha/logs/*.log || true

  release:
    needs: [test, windows-wrappers]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          version="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          mkdir dist
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/ipalpha-dev/tooling/internal/cli.Version=$version" \
              -o "dist/ipalpha-$os-$arch$ext" ./cmd/ipalpha
          done
          (cd dist && sha256sum ipalpha-* > checksums.txt)
          printf '{"version":"%s"}\n' "$version" > dist/version.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* --title "ipalpha $VERSION" --notes "Developer tool binaries. Installed by install.sh / install.ps1 and updated by ./pull." --latest
